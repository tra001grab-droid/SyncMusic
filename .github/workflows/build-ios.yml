name: Build iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project SyncMusic.xcodeproj -target SyncMusic -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build | tail -40
          test -d build/Release-iphoneos/SyncMusic.app
      - name: Package unsigned IPA
        run: |
          cd ios/build/Release-iphoneos
          mkdir -p Payload && cp -R SyncMusic.app Payload/
          zip -qr ../../SyncMusic-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SyncMusic-iOS-unsigned
          path: ios/SyncMusic-unsigned.ipa
