# XcodeGen spec: `xcodegen generate` creates SyncMusic.xcodeproj (done in CI).
name: SyncMusic
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  SyncMusic:
    type: application
    platform: iOS
    sources: [SyncMusic]
    info:
      path: SyncMusic/Info.plist
      properties:
        CFBundleDisplayName: Sync Music
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Local songs keep playing (and syncing) with the screen locked.
        UIBackgroundModes: [audio]
        # Finding and talking to the host on the Wi-Fi.
        NSLocalNetworkUsageDescription: Sync Music ភ្ជាប់ទៅទូរស័ព្ទ Host ក្នុង Wi-Fi ដើម្បីចាក់ចម្រៀងព្រមគ្នា។
        NSBonjourServices: [_syncmusic._tcp]
        # Songs are copied from the host over plain HTTP on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.syncmusic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
